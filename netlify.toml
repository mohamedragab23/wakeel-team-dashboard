# Secrets belong in Netlify environment variables, never in this file.
[build]
  command = "NODE_OPTIONS=--max-old-space-size=6144 npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.16.0"
  NEXT_TELEMETRY_DISABLED = "1"
  # Exclude non-credential resource identifiers, public Sentry ingestion settings,
  # boolean feature flags and the public S3 region. Never add passwords or tokens.
  # Keep scanning every credential and every source/output path.
  SECRETS_SCAN_OMIT_KEYS = "FEATURE_AUTO_EQUIPMENT_DEDUCTIONS_ENABLED,FEATURE_EQUIPMENT_LEDGER_ENABLED,FEATURE_EQUIPMENT_RETURNS_V2_ENABLED,FEATURE_MANUAL_DEDUCTIONS_V2_ENABLED,FEATURE_PAYOUT_CYCLES_ENABLED,FEATURE_RECRUITMENT_V2_ENABLED,TICKETING_S3_REGION,TELEGRAM_DEFAULT_CHAT_ID,GOOGLE_SHEETS_SPREADSHEET_ID,SENTRY_PROJECT,TICKETING_S3_BUCKET,SENTRY_ORG,PGHOST,PGDATABASE,NEXT_PUBLIC_SENTRY_DSN,SENTRY_PUBLIC_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"
